<app-card variant="secondary" class="form-busca">
  <form [formGroup]="formBuscaService.formBusca" (ngSubmit)="buscar()">
    <h2>Passagens</h2>
    <div class="flex-container">
      <mat-button-toggle-group aria-label="Tipo de passagem" formControlName="somenteIda">
        <mat-button-toggle [value]="false">
          <mat-icon *ngIf="!formBuscaService.formBusca.get('somenteIda')?.value">check</mat-icon>
          IDA E VOLTA
        </mat-button-toggle>
        <mat-button-toggle [value]="true">
          <mat-icon *ngIf="formBuscaService.formBusca.get('somenteIda')?.value">check</mat-icon>
          SOMENTE IDA
        </mat-button-toggle>
      </mat-button-toggle-group>
      <mat-chip (click)="formBuscaService.openDialog()">
        <div class="inner">
          <mat-icon>check</mat-icon> {{formBuscaService.getDescricaoPassageiros()}}
        </div>
      </mat-chip>
      <mat-chip (click)="formBuscaService.openDialog()">
        <div class="inner">
          <mat-icon>check</mat-icon> {{formBuscaService.obterControle('tipo').value}}
        </div>
      </mat-chip>
    </div>
    <div class="flex-container">
      <app-dropdown-uf label="Origem" iconePrefix="flight_takeoff" [control]="formBuscaService.obterControle('origem')" />
      <button mat-icon-button (click)="formBuscaService.trocarOrigemDestino()">
        <mat-icon>sync_alt</mat-icon>
      </button>
      <app-dropdown-uf label="Destino" iconePrefix="flight_land" [control]="formBuscaService.obterControle('destino')" />
      <mat-form-field class="input-container" appearance="outline">
        <mat-label>Data de Ida</mat-label>
        <input matInput [matDatepicker]="dataIda">
        <mat-datepicker-toggle matIconSuffix [for]="dataIda"></mat-datepicker-toggle>
        <mat-datepicker #dataIda></mat-datepicker>
      </mat-form-field>
      <mat-form-field class="input-container" appearance="outline">
        <mat-label>Data de volta</mat-label>
        <input matInput [matDatepicker]="dataVolta">
        <mat-datepicker-toggle matIconSuffix [for]="dataVolta"></mat-datepicker-toggle>
        <mat-datepicker #dataVolta></mat-datepicker>
      </mat-form-field>
      <button mat-flat-button color="primary">Buscar</button>
    </div>
  </form>
</app-card>
